[project]
name = "tiny-issue-tracker"
version = "0.1.0"
description = "A tiny SQLite issue tracker with a CLI and a PyQt6 Kanban board"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyqt6"]

[project.scripts]
issues = "tracker:main"
issues-board = "gui:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tracker.py", "gui.py"]

[tool.hatch.build.targets.sdist]
only-include = ["tracker.py", "gui.py", "test_tracker.py", "README.md"]

[tool.pytest.ini_options]
testpaths = ["test_tracker.py"]
